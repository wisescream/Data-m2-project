server:
  port: ${SERVER_PORT:8000}
  servlet:
    context-path: /

spring:
  application:
    name: finlake-control-plane
  datasource:
    url: jdbc:sqlserver://${SQLSERVER_HOST:127.0.0.1}:${SQLSERVER_PORT:1433};databaseName=${SQLSERVER_DATABASE:finlake_source};encrypt=false;trustServerCertificate=true
    username: ${SQLSERVER_USER:sa}
    password: ${SQLSERVER_SA_PASSWORD:FinLake2026!StrongPass#}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: FinLakeHikariPool

finlake:
  sqlserver:
    host: ${SQLSERVER_HOST:127.0.0.1}
    port: ${SQLSERVER_PORT:1433}
    database: ${SQLSERVER_DATABASE:finlake_source}
    user: ${SQLSERVER_USER:sa}
    password: ${SQLSERVER_SA_PASSWORD:FinLake2026!StrongPass#}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ROOT_USER:finlake_admin}
    secret-key: ${MINIO_ROOT_PASSWORD:finlake_secret_key_2026!}
    bucket: ${MINIO_BUCKET:finlake}
  trino:
    host: ${TRINO_HOST:127.0.0.1}
    port: ${TRINO_PORT:8080}
    user: ${TRINO_USER:finlake}
    catalog: ${TRINO_DEFAULT_CATALOG:hive}
    schema: ${TRINO_DEFAULT_SCHEMA:finlake_curated}
    jdbc-url: jdbc:trino://${TRINO_HOST:127.0.0.1}:${TRINO_PORT:8080}/hive/default
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    events-topic: ${KAFKA_EVENTS_TOPIC:finlake.polyglot.events}
    transactions-topic: ${KAFKA_TRANSACTIONS_TOPIC:finlake.transactions.events}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
