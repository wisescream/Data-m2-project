[libdefaults]
    default_realm = FINLAKE.INTERNAL
    dns_lookup_realm = false
    dns_lookup_kdc = false
    ticket_lifetime = 24h
    forwardable = true

[realms]
    FINLAKE.INTERNAL = {
        kdc = kerberos:88
        admin_server = kerberos:749
    }

[domain_realm]
    .finlake.internal = FINLAKE.INTERNAL
    finlake.internal = FINLAKE.INTERNAL
